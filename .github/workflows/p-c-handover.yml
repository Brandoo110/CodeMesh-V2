name: P-C Handover Experience

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p-c-handover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  handover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install web runtime
        run: python -m pip install --disable-pip-version-check -e ".[web]"

      - name: Run isolated API walkthrough
        run: python scripts/p_c_handover_walkthrough.py --output-dir "$RUNNER_TEMP/p-c-api-walkthrough"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Frontend focused checks
        working-directory: frontend
        run: |
          pnpm test
          pnpm exec tsc --noEmit
          pnpm lint
          pnpm build

      - name: Start isolated API and frontend
        env:
          P_C_DB: ${{ runner.temp }}/p-c-browser.sqlite
          P_C_API_LOG: ${{ runner.temp }}/p-c-api.log
          P_C_FRONTEND_LOG: ${{ runner.temp }}/p-c-frontend.log
        run: |
          PYTHONPATH=. python scripts/p_c_demo_server.py --db "$P_C_DB" --port 8010 >"$P_C_API_LOG" 2>&1 &
          echo $! > "$RUNNER_TEMP/p-c-api.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8010/api/health >/dev/null
          (cd frontend && NEXT_PUBLIC_API_BASE=http://127.0.0.1:8010 pnpm start -p 3010 >"$P_C_FRONTEND_LOG" 2>&1 & echo $! > "$RUNNER_TEMP/p-c-frontend.pid")
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3010/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3010/ >/dev/null

      - name: Install headless Chromium
        run: npm exec --yes --package=playwright@1.55.0 -- playwright install --with-deps chromium

      - name: Run target-user browser walkthrough
        env:
          FRONTEND_URL: http://127.0.0.1:3010
          WALKTHROUGH_OUTPUT_DIR: ${{ runner.temp }}/p-c-browser-walkthrough
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/p_c_browser_walkthrough.mjs

      - name: Upload walkthrough artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p-c-handover-walkthrough-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p-c-api-walkthrough
            ${{ runner.temp }}/p-c-browser-walkthrough
            ${{ runner.temp }}/p-c-api.log
            ${{ runner.temp }}/p-c-frontend.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop isolated walkthrough processes
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/p-c-frontend.pid"; then kill "$(cat "$RUNNER_TEMP/p-c-frontend.pid")" 2>/dev/null || true; fi
          if test -f "$RUNNER_TEMP/p-c-api.pid"; then kill "$(cat "$RUNNER_TEMP/p-c-api.pid")" 2>/dev/null || true; fi
