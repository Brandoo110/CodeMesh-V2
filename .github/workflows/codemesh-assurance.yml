name: CodeMesh Assurance

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  assurance:
    # A fork cannot provide the same-repository temporary evidence ref or the
    # App-backed Check permission. Fail closed instead of downgrading to a
    # local/provider-generated result.
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CODEMESH_TRANSPORT_HEAD: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify transport checkout
        run: test "$(git rev-parse HEAD)" = "$CODEMESH_TRANSPORT_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CodeMesh runtime
        run: python -m pip install --disable-pip-version-check -e .

      - name: Fetch exactly one authoritative Bundle ref
        env:
          CODEMESH_BUNDLE_PATH: ${{ runner.temp }}/codemesh-authoritative-bundle.json
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          sha_re = re.compile(r"^[0-9a-f]{40}$")
          ref_re = re.compile(r"^refs/heads/codex/evidence/[0-9a-f]{40}$")

          listed = subprocess.run(
              ["git", "ls-remote", "--heads", "origin", "refs/heads/codex/evidence/*"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          listed = [line for line in listed if line.strip()]
          if len(listed) != 1:
              raise SystemExit("expected exactly one temporary Bundle ref")
          evidence_commit, evidence_ref = listed[0].split("\t", 1)
          if not sha_re.fullmatch(evidence_commit) or not ref_re.fullmatch(evidence_ref):
              raise SystemExit("temporary Bundle ref identity is invalid")

          subprocess.run(["git", "fetch", "--no-tags", "origin", evidence_ref], check=True)
          tree = subprocess.run(
              ["git", "ls-tree", "-r", "--name-only", evidence_commit],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if tree != ["bundle.json"]:
              raise SystemExit("temporary ref must contain exactly bundle.json")
          bundle = subprocess.run(
              ["git", "show", f"{evidence_commit}:bundle.json"],
              check=True,
              capture_output=True,
          ).stdout
          target = Path(os.environ["CODEMESH_BUNDLE_PATH"])
          target.write_bytes(bundle)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"CODEMESH_EVIDENCE_REF={evidence_ref}\n")
              env.write(f"CODEMESH_EVIDENCE_REF_COMMIT={evidence_commit}\n")
          print("temporary_bundle_ref=verified")
          print(f"temporary_bundle_bytes={len(bundle)}")
          PY

      - name: Import Bundle and publish App-backed Check
        env:
          CODEMESH_BUNDLE_PATH: ${{ runner.temp }}/codemesh-authoritative-bundle.json
          CODEMESH_OUTPUT_DIR: ${{ runner.temp }}/codemesh-authoritative-artifacts
        run: |
          python -m assurance.integrations.github_actions \
            --bundle "$CODEMESH_BUNDLE_PATH" \
            --output-dir "$CODEMESH_OUTPUT_DIR" \
            --repository-root "$GITHUB_WORKSPACE" \
            --token-env GITHUB_TOKEN \
            --transport-head "$CODEMESH_TRANSPORT_HEAD" \
            --transport-ref-commit "$CODEMESH_EVIDENCE_REF_COMMIT" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-job-id "$GITHUB_JOB" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Verify CI-only import counters
        env:
          CODEMESH_OUTPUT_DIR: ${{ runner.temp }}/codemesh-authoritative-artifacts
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CODEMESH_OUTPUT_DIR"])
          receipt = json.loads((root / "bundle-receipt.json").read_text(encoding="utf-8"))
          publication = json.loads((root / "publication.json").read_text(encoding="utf-8"))
          zero_fields = (
              "case_writes",
              "provider_calls",
              "assurance_run_invocations",
          )
          for value in (receipt, publication):
              if any(value.get(field) != 0 for field in zero_fields):
                  raise SystemExit("CI import executed a forbidden local/provider path")
          print("case_writes=0")
          print("provider_calls=0")
          print("assurance_run_invocations=0")

          workbench = json.loads((root / "workbench.json").read_text(encoding="utf-8"))
          if workbench.get("origin") != "local_authoritative_bundle":
              raise SystemExit("Workbench origin was not authoritative Bundle")
          print("workbench_origin=local_authoritative_bundle")
          PY

      - name: Upload authoritative Workbench artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codemesh-authoritative-case-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codemesh-authoritative-artifacts
          if-no-files-found: error
          retention-days: 7
