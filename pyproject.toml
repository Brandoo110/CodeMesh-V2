[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codemesh"
version = "0.3.0"
description = "Local-first multi-model coding agent runtime"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Junjie Li" }]
dependencies = [
    "pydantic-ai>=0.0.14",
    "langfuse>=2.50.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Optional vector RAG for non-code document collections.
rag = [
    "chromadb>=0.5.0",
]
# Optional YAML frontmatter support for SKILL.md loading.
skills = [
    "pyyaml>=6.0",
]
# Optional token counting with tiktoken.
tokens = [
    "tiktoken>=0.7.0",
]
# FastAPI backend for the local web UI.
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
]
# Install all optional runtime features.
all = [
    "chromadb>=0.5.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
]

[project.scripts]
codemesh = "cli:app"

[tool.setuptools]
py-modules = ["harness", "cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["memory*", "execution*", "feedback*", "orchestration*", "rag*", "web*"]
