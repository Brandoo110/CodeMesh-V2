[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codemesh"
version = "0.1.0"
description = "国内多模型 Code Agent（Harness 架构实践）"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Junjie Li" }]
dependencies = [
    "pydantic-ai>=0.0.14",
    "langfuse>=2.50.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# RAG 功能所需。按需装：pip install -e ".[rag]"
rag = [
    "chromadb>=0.5.0",
]

[project.scripts]
codemesh = "cli:app"

[tool.setuptools]
py-modules = ["harness", "cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["memory*", "execution*", "feedback*", "orchestration*", "rag*"]
