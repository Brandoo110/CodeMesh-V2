[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codemesh"
version = "0.3.0"
description = "国内多模型 Code Agent（Harness 架构实践）"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Junjie Li" }]
dependencies = [
    "pydantic-ai>=0.0.14",
    "langfuse>=2.50.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# 向量 RAG（非代码场景）：pip install -e ".[rag]"
rag = [
    "chromadb>=0.5.0",
]
# Skill 加载用 YAML frontmatter：pip install -e ".[skills]"
# 没装也能用，会回退到 markdown 标题解析
skills = [
    "pyyaml>=6.0",
]
# Token 计数（与字符数对比更精确）：pip install -e ".[tokens]"
# 没装也能用，会回退到 CJK 启发式（误差 ±15%）
tokens = [
    "tiktoken>=0.7.0",
]
# Web UI 后端：pip install -e ".[web]"
# FastAPI + SSE streaming，详见 ADR-0006 / docs/ui-design-plan.md
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
]
# 全部可选项一次装：pip install -e ".[all]"
all = [
    "chromadb>=0.5.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
]

[project.scripts]
codemesh = "cli:app"

[tool.setuptools]
py-modules = ["harness", "cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["memory*", "execution*", "feedback*", "orchestration*", "rag*", "web*"]
